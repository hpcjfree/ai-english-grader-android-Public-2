name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # GitHub's ubuntu-latest image already contains the Android SDK.
      # Do NOT use android-actions/setup-android here: on some runner images it
      # attempts to install the obsolete SDK package named "tools" and exits 1.
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail

          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          python --version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-36"
          ls -la "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-English-Grader-v3.apk
          sha256sum dist/AI-English-Grader-v3.apk | tee dist/AI-English-Grader-v3.apk.sha256
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-English-Grader-v3-APK
          path: |
            dist/AI-English-Grader-v3.apk
            dist/AI-English-Grader-v3.apk.sha256
          if-no-files-found: error
          retention-days: 30
